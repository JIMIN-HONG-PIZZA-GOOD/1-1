<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>학교 게시물 아카이브 · 입구</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#272546;background:#f8f9ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:520px;width:100%;padding:38px 31px;background:white;border:1px solid #e9e6f6;border-radius:23px;box-shadow:0 16px 45px #382a7520;text-align:center}.logo{display:grid;place-items:center;background:linear-gradient(145deg,#8c7bf2,#6553cb);color:white;border-radius:17px;width:62px;height:62px;font-size:36px;margin:0 auto 22px}h1{font-size:27px;letter-spacing:-1px;margin-bottom:7px}p{line-height:1.8;color:#72768c;font-size:14px}.tag{display:inline-block;background:#eef9f4;color:#328d73;font-weight:800;padding:8px 12px;border-radius:30px;font-size:12px;margin:12px 0 21px}.button{display:block;width:100%;padding:16px;background:#7463da;border:0;color:white;font-size:15px;font-weight:800;border-radius:12px;text-decoration:none}.button[aria-disabled="true"]{background:#c4c5d3;cursor:not-allowed}.note{font-size:12px;color:#8a8ca1;margin-top:18px}.warning{background:#fff6e5;border:1px solid #f8e1aa;border-radius:9px;padding:12px;font-size:12px;color:#886d36;text-align:left;line-height:1.8}
</style></head><body><main class="box"><div class="logo">▱</div><h1>학교 게시물 아카이브</h1><p>우리 반의 학교 게시물을 사진으로 남기고<br>월별·일별로 찾아보는 디지털 아카이브</p><span class="tag">🔒 허용된 학교 Google 계정만 접속</span><a id="enterApp" class="button" href="#" aria-disabled="true">관리자가 앱 주소를 설정해주세요</a><p class="note">사진과 학생 계정 목록은 이 GitHub Pages 사이트에 저장되지 않습니다.</p><div class="warning">⚠️ 실제 자료는 Google Apps Script 웹앱에서만 제공됩니다. 이 페이지는 공개 안내용이며, 로그인하지 않은 사람에게 게시물 사진을 전달하지 않습니다.</div></main><script src="config.js"></script><script>const url=window.APP_SCRIPT_URL||'';if(/^https:\/\/script\.google\.com\/macros\/s\//.test(url)){const a=document.getElementById('enterApp');a.href=url;a.textContent='학교 Google 계정으로 들어가기 →';a.removeAttribute('aria-disabled');}else{document.getElementById('enterApp').addEventListener('click',e=>e.preventDefault());}</script></body></html>
